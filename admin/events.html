<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Events - Admin</title>
  <link rel="stylesheet" href="../css/global.css">
</head>
<body>
  <header>
    <nav>
      <span class="logo">Admin Console</span>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="registrations.html">Registrations</a></li>
        <li><button type="button" id="logoutBtn">Log Out</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="admin-page-header">
      <h1>Manage Events</h1>
      <p>Create, update, or remove club events.</p>
    </section>

    <!-- Create / Edit Event Form -->
    <section class="admin-form-section">
      <h2 id="formTitle">Add New Event</h2>
      <form id="eventForm" novalidate>
        <input type="hidden" id="eventId" name="id">

        <div class="form-group">
          <label for="eventTitle">Event Title</label>
          <input type="text" id="eventTitle" name="title" required placeholder="e.g. AI & Machine Learning Workshop">
        </div>

        <div class="form-group">
          <label for="eventCategory">Category</label>
          <select id="eventCategory" name="category" required>
            <option value="">Select category</option>
            <option value="Workshop">Workshop</option>
            <option value="Hackathon">Hackathon</option>
            <option value="Contest">Contest</option>
            <option value="Seminar">Seminar</option>
          </select>
        </div>

        <div class="form-group">
          <label for="eventDate">Date</label>
          <input type="date" id="eventDate" name="date" required>
        </div>

        <div class="form-group">
          <label for="eventStartTime">Start Time</label>
          <input type="time" id="eventStartTime" name="start_time" required>
        </div>

        <div class="form-group">
          <label for="eventVenue">Venue</label>
          <input type="text" id="eventVenue" name="venue" required placeholder="e.g. Room 204 or Online">
        </div>

        <div class="form-group">
          <label for="eventDescription">Description</label>
          <textarea id="eventDescription" name="description" rows="4" required placeholder="Full description of the event..."></textarea>
        </div>

        <div class="form-group">
          <label for="eventImageUrl">Image URL (Optional)</label>
          <input type="url" id="eventImageUrl" name="image_url" placeholder="https://example.com/banner.jpg">
        </div>

        <button type="submit" id="saveEventBtn">Save Event</button>
        <button type="reset" id="cancelEditBtn">Reset Form</button>
      </form>
    </section>

    <!-- Existing Events List / Table -->
    <section class="admin-table-section">
      <h2>Existing Events</h2>
      <table id="eventsTable">
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Date</th>
            <th>Venue</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="eventsTableBody">
          <tr>
            <td>Annual Hackathon 2026</td>
            <td>Hackathon</td>
            <td>2026-10-25</td>
            <td>Main Auditorium</td>
            <td>
              <button type="button" class="btn-edit">Edit</button>
              <button type="button" class="btn-delete">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 College Club Administration.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/admin/events.js"></script>
</body>
</html>
