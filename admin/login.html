<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - College Club</title>
  <link rel="stylesheet" href="../css/global.css">
</head>
<body>
  <header>
    <nav>
      <a href="../index.html" class="logo">College Club</a>
      <ul>
        <li><a href="../index.html">Back to Main Site</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="login-container">
      <h1>Admin Portal</h1>
      <p>Please authenticate to access club administration.</p>

      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label for="adminEmail">Email Address</label>
          <input type="email" id="adminEmail" name="email" required placeholder="admin@example.com">
        </div>

        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" id="loginBtn">Log In</button>
      </form>

      <div id="loginMessage" class="status-message" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 College Club. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/admin/auth.js"></script>
</body>
</html>
